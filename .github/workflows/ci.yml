name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      RIGYN_REQUIRE_PROCESS_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [26.7.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure native compiler on Windows
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64
      - name: Build native helper
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: npm run native:build --workspace @rigyn/terminal
      - name: Build kernel process launcher
        if: runner.os == 'Windows'
        run: npm run native:build --workspace @rigyn/kernel
      - run: npm run check

  regression-guards:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage:risk
      - run: npm run benchmark:runtime
