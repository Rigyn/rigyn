name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-guards:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit signatures
      - run: npm run test:coverage:risk
      - run: npm run benchmark:runtime

  native-build:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: x64
            runner: macos-15-intel
            output: native/darwin/prebuilds/darwin-x64/darwin-modifiers.node
          - platform: darwin
            arch: arm64
            runner: macos-15
            output: native/darwin/prebuilds/darwin-arm64/darwin-modifiers.node
          - platform: win32
            arch: x64
            runner: windows-2025
            msvc_arch: x64
            output: native/win32/prebuilds/win32-x64/win32-console-mode.node
          - platform: win32
            arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            output: native/win32/prebuilds/win32-arm64/win32-console-mode.node
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - run: npm ci --ignore-scripts
      - name: Configure native compiler on Windows
        if: matrix.platform == 'win32'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build native helper
        run: npm run native:build --workspace @rigyn/terminal
      - name: Load native helper on its matching runner
        run: npm run native:verify --workspace @rigyn/terminal
      - name: Build kernel process launcher
        if: matrix.platform == 'win32'
        run: npm run native:build --workspace @rigyn/kernel
      - name: Load kernel process launcher on its matching runner
        if: matrix.platform == 'win32'
        run: npm run native:verify --workspace @rigyn/kernel
      - name: Upload native helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigyn-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/terminal/native/${{ matrix.platform }}/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Upload kernel process launcher
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigyn-kernel-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/kernel/native/win32/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  platform-checks:
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      RIGYN_REQUIRE_PROCESS_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: 26.7.0
          - os: windows-latest
            node: 26.7.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure native compiler on Windows
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64
      - name: Build native helper
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: npm run native:build --workspace @rigyn/terminal
      - name: Build kernel process launcher
        if: runner.os == 'Windows'
        run: npm run native:build --workspace @rigyn/kernel
      - run: npm run check

  stage:
    needs:
      - regression-guards
      - native-build
      - platform-checks
    runs-on: ubuntu-24.04
    env:
      RIGYN_REQUIRE_PROCESS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Verify release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node --eval "const expected='v'+require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) throw new Error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME)"
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
      - run: npm ci --ignore-scripts
      - name: Download darwin-x64 native helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-native-darwin-x64
          path: packages/terminal/native/darwin/prebuilds/darwin-x64
      - name: Download darwin-arm64 native helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-native-darwin-arm64
          path: packages/terminal/native/darwin/prebuilds/darwin-arm64
      - name: Download win32-x64 native helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-native-win32-x64
          path: packages/terminal/native/win32/prebuilds/win32-x64
      - name: Download win32-arm64 native helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-native-win32-arm64
          path: packages/terminal/native/win32/prebuilds/win32-arm64
      - name: Download win32-x64 kernel process launcher
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-kernel-native-win32-x64
          path: packages/kernel/native/win32/prebuilds/win32-x64
      - name: Download win32-arm64 kernel process launcher
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-kernel-native-win32-arm64
          path: packages/kernel/native/win32/prebuilds/win32-arm64
      - name: Restore macOS keychain helper executable modes
        run: chmod 0755 packages/terminal/native/darwin/prebuilds/darwin-x64/rigyn-keychain-helper packages/terminal/native/darwin/prebuilds/darwin-arm64/rigyn-keychain-helper
      - run: npm run native:verify --workspace @rigyn/terminal -- --release
      - run: npm run native:verify --workspace @rigyn/kernel -- --release
      - run: npm run check
      - run: npm run build
      - run: npm run release:stage -- --output .release --source-ref "$GITHUB_SHA"
      - name: Upload staged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigyn-release-stage-${{ github.run_id }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  standalone-build:
    needs: stage
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: win32
            arch: x64
            runner: windows-2025
          - platform: win32
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - run: npm ci --ignore-scripts
      - name: Download staged package archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-release-stage-${{ github.run_id }}
          path: .release
      - name: Build and runtime-verify standalone archive
        run: npm run release:standalone -- --directory .release --output .standalone
      - name: Upload standalone archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigyn-standalone-${{ matrix.platform }}-${{ matrix.arch }}
          path: .standalone/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  finalize:
    needs:
      - stage
      - standalone-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Download staged package archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-release-stage-${{ github.run_id }}
          path: .release
      - name: Download standalone archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rigyn-standalone-*
          path: .standalone
          merge-multiple: true
      - name: Generate SPDX 2.3 SBOM
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./.release/release-manifest.json').version")"
          npm sbom --sbom-format spdx --package-lock-only > ".release/rigyn-v${version}.spdx.json"
      - run: npm run release:finalize -- --directory .release --standalone-directory .standalone
      - name: Upload finalized release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rigyn-release-${{ github.run_id }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  verify:
    needs: finalize
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: win32
            arch: x64
            runner: windows-2025
          - platform: win32
            arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - run: npm ci --ignore-scripts
      - name: Download staged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-release-${{ github.run_id }}
          path: .release
      - name: Extract and build the release source archive
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: node scripts/verify-source-archive.mjs --directory .release --build
      - name: Verify Node-native release
        run: >-
          node scripts/verify-release-artifact.mjs
          --directory .release
          --expected-platform ${{ matrix.platform }}
          --expected-arch ${{ matrix.arch }}

  publish:
    if: github.event_name == 'push'
    needs:
      - stage
      - verify
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Download staged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rigyn-release-${{ github.run_id }}
          path: .release
      - name: Verify staged checksum
        id: release-metadata
        working-directory: .release
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          version="$(node -p "require('./release-manifest.json').version")"
          sbom="rigyn-v${version}.spdx.json"
          test -f "$sbom"
          source="$(node -p "require('./release-manifest.json').source.file")"
          awk -v source="$source" '$2 == source { print; matches += 1 } END { if (matches != 1) exit 1 }' \
            SHA256SUMS > SBOM-SUBJECTS
          echo "sbom=.release/$sbom" >> "$GITHUB_OUTPUT"
          echo "sbom-subjects=.release/SBOM-SUBJECTS" >> "$GITHUB_OUTPUT"
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./.release/release-manifest.json').version")"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,assets > .release/draft-assets.json 2>/dev/null; then
            node --input-type=module <<'NODE' > .release/draft-asset-ids
          import { readFileSync } from "node:fs";
          const release = JSON.parse(readFileSync(".release/draft-assets.json", "utf8"));
          if (release.isDraft !== true || !Array.isArray(release.assets)) {
            throw new Error("Existing GitHub release is not an inspectable draft");
          }
          const repository = process.env.GITHUB_REPOSITORY?.toLowerCase();
          if (repository === undefined) throw new Error("GITHUB_REPOSITORY is unavailable");
          for (const asset of release.assets) {
            const url = new URL(asset.apiUrl);
            const parts = url.pathname.split("/").filter(Boolean);
            if (url.protocol !== "https:" || url.host !== "api.github.com" || parts.length !== 6
              || parts[0] !== "repos" || `${parts[1]}/${parts[2]}`.toLowerCase() !== repository
              || parts[3] !== "releases" || parts[4] !== "assets" || !/^\d+$/u.test(parts[5])) {
              throw new Error(`Unexpected draft asset API URL: ${asset.apiUrl}`);
            }
            process.stdout.write(`${parts[5]}\n`);
          }
          NODE
            while IFS= read -r asset_id; do
              test -z "$asset_id" || gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < .release/draft-asset-ids
            gh release edit "$GITHUB_REF_NAME" --title "rigyn $version" --notes-file .release/RELEASE_NOTES.md --draft
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "rigyn $version" --notes-file .release/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" .release/*.tgz .release/*.tar.gz .release/*.spdx.json .release/SHA256SUMS .release/release-manifest.json .release/RELEASE_NOTES.md --clobber
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets > .release/draft-assets.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync(".release/release-manifest.json", "utf8"));
          const release = JSON.parse(readFileSync(".release/draft-assets.json", "utf8"));
          if (release.isDraft !== true || !Array.isArray(release.assets)) {
            throw new Error("Uploaded GitHub release is not an inspectable draft");
          }
          const expected = [
            ...manifest.archives.map(({ file }) => file),
            manifest.source.file,
            ...manifest.standalones.map(({ file }) => file),
            `rigyn-v${manifest.version}.spdx.json`,
            manifest.checksumFile,
            "release-manifest.json",
            manifest.releaseNotes,
          ];
          const actual = release.assets.map(({ name }) => name);
          const missing = expected.filter((name) => !actual.includes(name));
          const unexpected = actual.filter((name) => !expected.includes(name));
          if (new Set(expected).size !== expected.length || new Set(actual).size !== actual.length
            || missing.length > 0 || unexpected.length > 0) {
            throw new Error(`GitHub draft asset inventory mismatch; missing=${missing.join(",")} unexpected=${unexpected.join(",")}`);
          }
          NODE
      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: .release/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.release-metadata.outputs.sbom-subjects }}
          sbom-path: ${{ steps.release-metadata.outputs.sbom }}
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
