<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">rigyn V4 journal, session tree, and compaction boundary</title>
  <desc id="desc">A V4 session header is followed by ordered commits. Commit changes reduce to operation, queue, tool-effect, selection, and immutable conversation state. Parent IDs form the conversation tree. A compaction node changes provider projection without deleting older commits or nodes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#090a0a" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter"/>
    </marker>
    <style>
      .frame { fill: #f3f1e8; stroke: #090a0a; stroke-width: 3; }
      .card { fill: #ffffff; stroke: #090a0a; stroke-width: 3; }
      .strong { fill: #c8c5ba; stroke: #090a0a; stroke-width: 3; }
      .node { fill: #ffffff; stroke: #090a0a; stroke-width: 3; }
      .muted-node { fill: #c8c5ba; stroke: #090a0a; stroke-width: 3; }
      .edge { fill: none; stroke: #090a0a; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .arrow { fill: none; stroke: #090a0a; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #090a0a; stroke-width: 3; stroke-dasharray: 10 10; }
      .diamond { fill: #090a0a; }
      .heading { fill: #090a0a; font: 600 36px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .label { fill: #090a0a; font: 600 25px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .detail { fill: #090a0a; font: 400 19px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .small { fill: #090a0a; font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect class="frame" x="12" y="12" width="1576" height="916"/>
  <text class="heading" x="56" y="70">session tree and active context</text>
  <path d="M56 92h176v18H56m58-18v18m58-18v18" fill="none" stroke="#090a0a" stroke-width="3"/>

  <rect class="card" x="56" y="142" width="520" height="110"/>
  <text class="label" x="86" y="186">V4 JSONL file order</text>
  <text class="detail" x="86" y="216">session header · commit 1 · commit 2 · …</text>
  <text class="detail" x="86" y="242">nodes · operation · queue · effects · head</text>

  <rect class="strong" x="1024" y="142" width="520" height="110"/>
  <text class="label" x="1054" y="186">branch context</text>
  <text class="detail" x="1054" y="220">follow parentId from the selected leaf</text>

  <text class="label" x="56" y="326">reduced immutable conversation tree</text>

  <rect class="node" x="92" y="370" width="112" height="64"/>
  <text class="label" x="134" y="411">A</text>
  <path class="edge" d="M204 402h104"/>
  <rect class="node" x="308" y="370" width="112" height="64"/>
  <text class="label" x="350" y="411">B</text>

  <path class="edge" d="M420 402h88v-106h88"/>
  <rect class="node" x="596" y="264" width="112" height="64"/>
  <text class="label" x="638" y="305">C</text>
  <path class="edge" d="M708 296h118"/>
  <rect class="node" x="826" y="264" width="112" height="64"/>
  <text class="label" x="868" y="305">D</text>

  <path class="edge" d="M420 402h88v106h88"/>
  <rect class="node" x="596" y="476" width="112" height="64"/>
  <text class="label" x="638" y="517">E</text>

  <path class="edge" d="M938 296h84v78h92"/>
  <rect class="muted-node" x="1114" y="342" width="214" height="112"/>
  <text class="label" x="1144" y="386">compaction</text>
  <text class="detail" x="1144" y="420">retained node: D</text>

  <path class="edge" d="M1328 398h100"/>
  <rect class="node" x="1428" y="366" width="112" height="64"/>
  <text class="label" x="1470" y="407">F</text>
  <path class="diamond" d="m1484 458 17 17-17 17-17-17z"/>
  <text class="small" x="1390" y="524">selected leaf</text>

  <path class="dash" d="M1221 454v126H882V328"/>
  <text class="small" x="910" y="568">retainedNodeIds[0]</text>

  <rect class="strong" x="56" y="636" width="1488" height="210"/>
  <text class="label" x="88" y="684">projected provider context at leaf F</text>

  <rect class="card" x="88" y="728" width="300" height="74"/>
  <text class="detail" x="114" y="774">synthetic compaction summary</text>
  <path class="arrow" d="M388 765h72"/>
  <rect class="card" x="460" y="728" width="190" height="74"/>
  <text class="detail" x="518" y="774">D</text>
  <path class="arrow" d="M650 765h94"/>
  <rect class="card" x="744" y="728" width="190" height="74"/>
  <text class="detail" x="802" y="774">F</text>
  <path class="arrow" d="M934 765h94"/>
  <rect class="card" x="1028" y="728" width="482" height="74"/>
  <text class="detail" x="1054" y="774">later reachable nodes</text>

  <text class="small" x="56" y="890">Older commits and nodes remain in the journal; compaction omits them only from this provider projection.</text>
</svg>
